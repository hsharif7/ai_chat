<!DOCTYPE html>
<html>
<head>
        <title>AI Chat</title>
</head>
<body>
        <h1>Login</h1>
        <input type="email" id="email" placeholder="email">
        <input type="password" id="password" placeholder="password">
        <button id="login">login</button>
        <h2 id = "h2">Log into your account</h2>
        <h3 id = "h3">Don't have an acount? Sign up</h3>
        <button id="signup">Sign Up</button>
        <h4 id = "h4">Want to try it out first?</h4>
        <button id="guest">Guest</button>

        <script>
            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const button = document.getElementById("login");
            const gbutton = document.getElementById("guest");
            const sbutton = document.getElementById("signup");
            const h2 = document.getElementById("h2");

        button.addEventListener('click', async function(){
            const response = await fetch ( 'https://ai-chat-yowc.onrender.com/login', {
                method: "POST",
                credentials: "include",
                headers: {'content-type': 'application/json'},
                body: JSON.stringify({
                    email: email.value,
                    password: password.value
                })
            })
            const data = await response.json()
            if (data.status) {
                sessionStorage.setItem ("guest", false)
                window.location.href = `chat.html`;
            } else{
                h2.innerText = data.message
            }
        })

        sbutton.addEventListener('click', async function() {
            window.location.href = "singup.html"
        })

        gbutton.addEventListener('click', async function() {
            sessionStorage.setItem ("guest", true)
            window.location.href = "chat.html"
        })
        </script>
</body>
</html>
